<style>
@font-face{font-family:Vazirmatn;font-weight:400;src:url(fonts/vazirmatn-arabic-400-normal.woff2) format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+200C-200F,U+FB50-FDFF,U+FE70-FEFF}
@font-face{font-family:Vazirmatn;font-weight:500;src:url(fonts/vazirmatn-arabic-500-normal.woff2) format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+200C-200F,U+FB50-FDFF,U+FE70-FEFF}
@font-face{font-family:Vazirmatn;font-weight:700;src:url(fonts/vazirmatn-arabic-700-normal.woff2) format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+200C-200F,U+FB50-FDFF,U+FE70-FEFF}
@font-face{font-family:Vazirmatn;font-weight:800;src:url(fonts/vazirmatn-arabic-800-normal.woff2) format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+200C-200F,U+FB50-FDFF,U+FE70-FEFF}
@font-face{font-family:Vazirmatn;font-weight:400;src:url(fonts/vazirmatn-latin-400-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:Vazirmatn;font-weight:500;src:url(fonts/vazirmatn-latin-500-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:Vazirmatn;font-weight:700;src:url(fonts/vazirmatn-latin-700-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:Vazirmatn;font-weight:800;src:url(fonts/vazirmatn-latin-800-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F}
:root{
  --navy:#01254E;--navy-2:#0A3A6E;--navy-soft:#E8EEF6;--ink:#0F1B2D;--muted:#5B6B80;--line:#DCE3EC;
  --bg:#F4F6FA;--card:#FFFFFF;--gold:#F5B301;--ok:#13824A;--ok-bg:#E3F4EA;--out:#C62828;--out-bg:#FBE7E7;--ask:#946200;--ask-bg:#FFF4D6;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Vazirmatn,Tahoma,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
button,input,select,textarea{font-family:inherit;font-size:inherit}
.top{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;display:flex;align-items:center;gap:18px;padding:10px 22px;box-shadow:0 2px 10px rgba(1,37,78,.25)}
.top img{height:46px}
.top .name{display:flex;flex-direction:column;line-height:1.35}
.top .name b{font-size:17px;font-weight:800}
.top .name span{font-size:12px;opacity:.8}
.search{flex:1;max-width:560px;margin-inline-start:auto;position:relative}
.search input{width:100%;border:0;border-radius:12px;padding:11px 42px 11px 14px;background:#fff;color:var(--ink);outline:none}
.search svg{position:absolute;right:13px;top:50%;transform:translateY(-50%);color:var(--muted)}
.stamp{display:flex;align-items:center;gap:10px;font-size:12px;white-space:nowrap}
.stamp .day{background:rgba(255,255,255,.12);border-radius:10px;padding:6px 10px;line-height:1.5;text-align:center}
.stamp .day b{display:block;font-size:14px;color:var(--gold)}
.iconbtn{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:10px;width:38px;height:38px;cursor:pointer;display:grid;place-items:center}
.iconbtn:hover{background:rgba(255,255,255,.24)}
.iconbtn.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(-360deg)}}
.stale{background:var(--ask-bg);color:var(--ask);padding:8px 22px;font-weight:700;display:none;text-align:center}
.wrap{display:flex;gap:20px;padding:20px 22px;align-items:flex-start}
aside{width:230px;flex:none;position:sticky;top:86px;max-height:calc(100vh - 100px);overflow:auto;background:var(--card);border-radius:16px;padding:14px;border:1px solid var(--line)}
aside h4{margin:4px 6px 8px;font-size:12px;color:var(--muted);font-weight:700}
.nav button{display:flex;justify-content:space-between;width:100%;border:0;background:none;padding:9px 10px;border-radius:10px;cursor:pointer;color:var(--ink);text-align:right}
.nav button:hover{background:var(--navy-soft)}
.nav button.on{background:var(--navy);color:#fff;font-weight:700}
.nav button small{opacity:.65}
.toggle{display:flex;align-items:center;gap:8px;padding:10px;margin-top:6px;border-top:1px solid var(--line);cursor:pointer;user-select:none}
.toggle input{width:18px;height:18px;accent-color:var(--navy)}
main{flex:1;min-width:0}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.bar h2{margin:0;font-size:20px;font-weight:800;color:var(--navy)}
.bar .count{color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-inline-start:auto}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;cursor:pointer;color:var(--ink)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(1,37,78,.12)}
.pic{aspect-ratio:1/1;background:#fff;display:grid;place-items:center;position:relative;border-bottom:1px solid var(--line)}
.pic img{width:88%;height:88%;object-fit:contain}
.ph{width:100%;height:100%;display:grid;place-items:center;background:linear-gradient(135deg,var(--navy-soft),#fff);color:var(--navy);text-align:center;padding:16px}
.ph b{font-size:22px;font-weight:800;display:block}
.ph span{font-size:12px;color:var(--muted)}
.badge{position:absolute;top:10px;left:10px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px}
.b-ok{background:var(--ok-bg);color:var(--ok)}.b-out{background:var(--out-bg);color:var(--out)}.b-ask{background:var(--ask-bg);color:var(--ask)}
.info{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.info .brand{font-size:12px;color:var(--muted)}
.info .title{font-weight:700;line-height:1.6;min-height:2.8em}
.info .price{margin-top:auto;display:flex;align-items:baseline;gap:4px;color:var(--navy)}
.info .price b{font-size:18px;font-weight:800}
.info .price small{color:var(--muted);font-size:11px}
.info .price.na{color:var(--out);font-weight:700}
.info .price.askp{color:var(--ask);font-weight:700}
.dots{display:flex;gap:4px;flex-wrap:wrap}
.dots span{font-size:11px;padding:1px 7px;border-radius:6px;background:var(--navy-soft);color:var(--navy-2)}
.dots span.x{background:#F1F1F1;color:#999;text-decoration:line-through}
.empty{padding:60px;text-align:center;color:var(--muted)}
/* detail */
.modal{position:fixed;inset:0;background:rgba(5,18,36,.55);display:none;align-items:center;justify-content:center;z-index:20;padding:24px}
.modal.open{display:flex}
.sheet{background:#fff;border-radius:20px;width:min(1100px,100%);max-height:100%;overflow:auto;display:grid;grid-template-columns:420px 1fr;position:relative}
.sheet .left{padding:24px;border-left:1px solid var(--line);position:sticky;top:0;align-self:start}
.sheet .big{aspect-ratio:1/1;border-radius:14px;border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;background:#fff}
.sheet .big img{width:92%;height:92%;object-fit:contain}
.sheet .right{padding:26px 28px}
.close{position:absolute;top:14px;left:14px;width:36px;height:36px;border-radius:10px;border:0;background:var(--navy-soft);color:var(--navy);cursor:pointer;font-size:18px;z-index:2}
.sheet h1{margin:0 0 4px;font-size:22px;color:var(--navy);font-weight:800;line-height:1.6}
.sheet .sub{color:var(--muted);margin-bottom:16px}
.colors{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:18px}
.colors div{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;border-top:1px solid var(--line)}
.colors div:first-child{border-top:0}
.colors .p{font-weight:800;color:var(--navy);font-size:16px}
.colors .p small{font-weight:400;color:var(--muted);font-size:11px}
.tag{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px}
.primary{width:100%;margin-top:16px;border:0;border-radius:12px;padding:13px;background:var(--navy);color:#fff;font-weight:700;cursor:pointer;display:flex;gap:8px;align-items:center;justify-content:center}
.primary:hover{background:var(--navy-2)}
.sec h3{font-size:15px;color:var(--navy);margin:20px 0 10px;display:flex;align-items:center;gap:8px}
.sec h3:before{content:"";width:4px;height:16px;border-radius:2px;background:var(--gold)}
.feat{margin:0;padding:0 18px 0 0;line-height:2}
.specs{width:100%;border-collapse:collapse}
.specs td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.7}
.specs td:first-child{color:var(--muted);width:38%}
.specs tr:nth-child(odd) td{background:#FAFBFD}
.desc{line-height:2.1;color:#26354A;white-space:pre-line;text-align:justify}
.nodata{background:var(--navy-soft);border-radius:12px;padding:14px;color:var(--navy-2);line-height:1.9}
/* card preview */
.cardprev{display:none;position:fixed;inset:0;background:rgba(5,18,36,.7);z-index:30;align-items:center;justify-content:center;flex-direction:column;gap:14px;padding:20px}
.cardprev.open{display:flex}
.cardprev canvas{max-height:calc(100vh - 120px);max-width:100%;border-radius:12px;box-shadow:0 20px 50px rgba(0,0,0,.4);background:#fff}
.cardprev .row{display:flex;gap:10px}
.cardprev button{border:0;border-radius:12px;padding:11px 22px;font-weight:700;cursor:pointer}
.cardprev .save{background:var(--gold);color:var(--navy)}
.cardprev .cancel{background:#fff;color:var(--navy)}
/* sale */
:root{--sale:#D32F2F;--sale-bg:#FDECEC}
.nav button.salebtn{color:var(--sale);font-weight:800}
.nav button.salebtn.on{background:var(--sale);color:#fff}
.b-sale{background:var(--sale);color:#fff;left:auto;right:10px}
.info .price.sale{color:var(--sale);flex-wrap:wrap}
.info .price s,.colors s{color:var(--muted);font-weight:400;font-size:12px}
.colors .p.red{color:var(--sale)}
.colors .crow{cursor:pointer}
.colors .crow:hover{background:#FAFBFD}
.colors .crow.sel{background:var(--navy-soft);box-shadow:inset 3px 0 0 var(--navy)}
.pcap{font-size:12px;color:var(--muted);text-align:center;margin-top:8px;min-height:18px}
.pcap.warn{color:var(--ask)}
.salebar{background:linear-gradient(90deg,var(--sale),#F05A28);color:#fff;border-radius:14px;padding:12px 16px;margin-bottom:14px;display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:700}
.salebar span{font-weight:400;opacity:.9}
/* header buttons */
.refreshbtn,.acct{border:0;border-radius:10px;height:40px;padding:0 14px;display:flex;align-items:center;gap:7px;cursor:pointer;font-weight:700;white-space:nowrap}
.refreshbtn{background:var(--gold);color:var(--navy)}
.refreshbtn:hover{filter:brightness(1.05)}
.refreshbtn.spin svg{animation:spin 1s linear infinite}
.acct{background:rgba(255,255,255,.14);color:#fff}
.acct:hover{background:rgba(255,255,255,.24)}
.day small{display:block;font-size:10px;opacity:.75}
/* product actions */
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.actions button{border-radius:12px;padding:12px;font-weight:700;cursor:pointer;border:2px solid var(--navy)}
.btn-order{background:var(--gold);border-color:var(--gold)!important;color:var(--navy)}
.btn-offer{background:#fff;color:var(--navy)}
.primary.ghost{background:var(--navy-soft);color:var(--navy)}
/* forms */
.dialog{position:fixed;inset:0;background:rgba(5,18,36,.6);z-index:35;display:none;align-items:center;justify-content:center;padding:20px}
.dialog.open{display:flex}
.dbox{background:#fff;border-radius:18px;width:min(480px,100%);max-height:100%;overflow:auto;padding:24px;position:relative}
.dbox h2{margin:0 0 4px;color:var(--navy);font-size:19px}
.dbox .hint{color:var(--muted);font-size:12px;margin-bottom:14px;line-height:1.8}
.dbox label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
.dbox input,.dbox select,.dbox textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#FAFBFD;color:var(--ink);outline:none}
.dbox input:focus,.dbox select:focus,.dbox textarea:focus{border-color:var(--navy);background:#fff}
.dbox textarea{min-height:80px;resize:vertical}
.dbox .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dbox .err{color:var(--out);font-size:12px;min-height:18px;margin-top:8px}
.dbox .tabs{display:flex;gap:6px;background:var(--navy-soft);border-radius:12px;padding:4px;margin-bottom:12px}
.dbox .tabs button{flex:1;border:0;background:none;border-radius:9px;padding:8px;cursor:pointer;color:var(--navy);font-weight:700}
.dbox .tabs button.on{background:#fff;box-shadow:0 1px 4px rgba(1,37,78,.12)}
.dbox .prod{display:flex;gap:12px;align-items:center;background:var(--navy-soft);border-radius:12px;padding:10px;margin-bottom:6px}
.dbox .prod img{width:56px;height:56px;object-fit:contain;background:#fff;border-radius:8px}
.dbox .prod b{color:var(--navy);line-height:1.6}
.req{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;line-height:1.8}
.req .st{float:left;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px}
.st.sent{background:var(--ok-bg);color:var(--ok)}.st.queued{background:var(--ask-bg);color:var(--ask)}
.req small{color:var(--muted)}
.menu{position:absolute;top:58px;left:22px;background:#fff;border-radius:12px;box-shadow:0 10px 30px rgba(1,37,78,.2);min-width:220px;display:none;z-index:8;overflow:hidden}
.menu.open{display:block}
.menu .who{padding:12px 14px;border-bottom:1px solid var(--line);color:var(--ink);line-height:1.7}
.menu .who small{color:var(--muted)}
.menu button{display:block;width:100%;text-align:right;border:0;background:none;padding:11px 14px;cursor:pointer;color:var(--ink)}
.menu button:hover{background:var(--navy-soft)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:12px;display:none;z-index:40}
@media (max-width:820px){aside{display:none}.sheet{grid-template-columns:1fr}.sheet .left{position:static;border:0}.stamp .lbl{display:none}}
/* phone (Android app): two products per row, categories as a sliding strip */
@media (max-width:600px){
  body{font-size:13px}
  .top{flex-wrap:wrap;gap:8px 10px;padding:8px 12px}
  .top img{height:36px}
  .top .name{flex:1;min-width:0}
  .top .name b{font-size:12.5px;line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .top .name span{display:none}
  .search{order:5;flex:1 0 100%;max-width:none;margin:0}
  .search input{padding:9px 38px 9px 12px}
  .stamp{margin-inline-start:auto;gap:6px}
  .stamp .day{padding:3px 8px}.stamp .day b{font-size:13px}.day small{font-size:9px}
  .refreshbtn,.acct{height:38px;width:38px;padding:0;justify-content:center;font-size:0;gap:0}
  .menu{top:54px;left:12px}
  .wrap{flex-direction:column;align-items:stretch;gap:8px;padding:10px 12px}
  aside{display:block;position:static;width:auto;max-height:none;overflow:visible;padding:0;background:none;border:0;border-radius:0}
  aside h4{display:none}
  .nav{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .nav::-webkit-scrollbar,.chips::-webkit-scrollbar{display:none}
  .nav button{width:auto;flex:none;white-space:nowrap;gap:6px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 12px}
  .nav button.on{border-color:var(--navy)}.nav button.salebtn.on{border-color:var(--sale)}
  .toggle{border-top:0;margin:0;padding:6px 2px 0}
  .bar{margin-bottom:10px;gap:6px}.bar h2{font-size:17px}
  .chips{flex-wrap:nowrap;overflow-x:auto;width:100%;margin:0;scrollbar-width:none}
  .chip{flex:none;white-space:nowrap}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .card{border-radius:12px}.card:hover{transform:none;box-shadow:none}
  .info{padding:8px 10px 10px;gap:4px}
  .info .brand{font-size:11px}
  .info .title{font-size:12.5px;line-height:1.55;min-height:3.1em}
  .info .price b{font-size:15px}
  .badge{top:6px;left:6px;font-size:10px;padding:2px 7px}.b-sale{left:auto;right:6px}
  .dots span{font-size:10px}
  .salebar{padding:10px 12px;font-size:13px;flex-wrap:wrap}
  .empty{padding:40px 10px}
  .modal{padding:0}
  .sheet{border-radius:0;height:100%;max-height:none}
  .sheet .left{padding:52px 14px 4px}
  .sheet .big{aspect-ratio:4/3}
  .sheet .right{padding:6px 16px 28px}
  .sheet h1{font-size:18px}
  .close{top:10px;left:10px}
  .dialog{padding:0;align-items:flex-end}
  .dbox{border-radius:18px 18px 0 0;max-height:94%;padding:20px 16px}
  .cardprev{padding:12px}
  .cardprev canvas{max-height:calc(100% - 80px)}
  .toast{bottom:16px;width:max-content;max-width:calc(100% - 24px);text-align:center;line-height:1.7}
}
</style>
<style>
/* iPhone notch and home bar: opened from the Home Screen the page runs under the status bar */
.top{padding-top:max(10px,env(safe-area-inset-top))}
.toast{bottom:max(22px,calc(env(safe-area-inset-bottom) + 8px))}
@media (max-width:600px){
  .top{padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right))}
  .sheet .left{padding-top:max(52px,calc(env(safe-area-inset-top) + 44px))}
  .close{top:max(10px,env(safe-area-inset-top))}
  .dbox{padding-bottom:max(20px,calc(env(safe-area-inset-bottom) + 12px))}
}
input,select,textarea{font-size:16px!important} /* iPhone zooms into smaller inputs */
</style>

<body>
<header class="top">
  <img src="logo-white.png" alt="">
  <div class="name"><b id="company">بهراد تجارت</b><span>کاتالوگ محصولات و قیمت روز همکاران</span></div>
  <label class="search">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" placeholder="جستجوی مدل، برند یا دسته… (مثلاً ۸۴۰ یا یخچال دوقلو)" autocomplete="off">
  </label>
  <div class="stamp">
    <div class="day"><span class="lbl">قیمت روز</span><b id="day">—</b><small id="upd"></small></div>
    <button class="refreshbtn" id="refresh" title="گرفتن آخرین قیمت و موجودی">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>به‌روزرسانی
    </button>
    <button class="acct" id="acct"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg><span id="acctName">ورود / ثبت‌نام</span></button>
  </div>
  <div class="menu" id="menu"></div>
</header>
<div class="stale" id="stale"></div>
<div class="wrap">
  <aside>
    <h4>دسته‌بندی</h4>
    <div class="nav" id="groups"></div>
    <label class="toggle"><input type="checkbox" id="instock"> فقط کالاهای موجود</label>
  </aside>
  <main>
    <div class="bar">
      <h2 id="heading">همه محصولات</h2><span class="count" id="count"></span>
      <div class="chips" id="brands"></div>
    </div>
    <div class="grid" id="grid"></div>
  </main>
</div>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="cardprev" id="cardprev">
  <canvas id="cv" width="1080" height="1350"></canvas>
  <div class="row"><button class="save" id="saveCard">ذخیره عکس کارت</button><button class="cancel" id="closeCard">بستن</button></div>
</div>
<div class="dialog" id="dialog"><div class="dbox" id="dbox"></div></div>
<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const FA = "۰۱۲۳۴۵۶۷۸۹";
const fa = v => String(v).replace(/\d/g, d => FA[d]);
const money = n => fa(Number(n).toLocaleString("en-US").replace(/,/g, "٬"));
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm = s => String(s || "").replace(/[۰-۹]/g, d => FA.indexOf(d)).replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d))
  .replace(/ي/g, "ی").replace(/ك/g, "ک").replace(/[‌⁦-⁩-]/g, "").replace(/\s+/g, "").toLowerCase();

const GROUPS = [
  ["یخچال و فریزر", /یخچال|فریزر|ساید/], ["لباسشویی", /لباسشویی/], ["ظرفشویی", /ظرفشویی/],
  ["تلویزیون", /تلویزیون|تلوزیون|tv/i], ["جاروبرقی", /جارو/], ["کولر", /کولر/],
  ["بخاری و شومینه", /بخاری|شومینه|هیتر/], ["آبگرمکن", /آبگرمکن/], ["آبسردکن", /آبسردکن/],
];
function groupOf(p) {
  const text = p.category + " " + p.model;
  // پاکشوما «کولر گازی و جارو»: اول مدل، بعد دسته
  for (const [name, re] of GROUPS) if (re.test(p.model)) return name;
  for (const [name, re] of GROUPS) if (re.test(p.category)) return name;
  return "لوازم خرد و سایر";
}
function stateOf(p) {
  if (p.colors.some(c => c.status === "ok")) return "ok";
  if (p.colors.some(c => c.status === "ask")) return "ask";
  return "out";
}
const STATE = {ok: ["موجود", "b-ok"], out: ["ناموجود", "b-out"], ask: ["استعلام", "b-ask"]};
function minPrice(p) {
  const v = p.colors.filter(c => c.status === "ok").map(c => c.price);
  return v.length ? Math.min(...v) : null;
}
const colorName = c => c.name || "تک‌رنگ";
const src = (path, v) => path ? `${window.BEHRAD_WEB.base}${path}?v=${v || ""}` : null;
// the photo for one colour: its own photo, else the product's main photo (then marked as another colour)
function photoOf(p, c) {
  if (c && c.image) return {url: src(c.image, c.image_v), own: true};
  return p.image ? {url: src(p.image, p.image_v), own: false} : null;
}
const imgUrl = p => { const c = p.colors.find(x => x.image && (x.sale || x.status === "ok")) || p.colors.find(x => x.image); return (photoOf(p, c) || {}).url || null; };

let DATA = null, META = {}, VIEW = {q: "", group: null, brand: null, instock: false}, SEL = 0;

function placeholder(p) {
  return `<div class="ph"><div><b>${esc(p.brand)}</b><span>${esc(p.model)}</span></div></div>`;
}

function filtered() {
  const q = norm(VIEW.q);
  return DATA.products.filter(p => {
    if (VIEW.group === "__sale") { if (!p._sale) return false; }
    else if (VIEW.group && p.group !== VIEW.group) return false;
    if (VIEW.brand && p.brand !== VIEW.brand) return false;
    if (VIEW.instock && p._state !== "ok") return false;
    if (q && !p._search.includes(q)) {
      // چند کلمه: همه باید باشند
      const parts = VIEW.q.trim().split(/\s+/).map(norm).filter(Boolean);
      if (!parts.every(x => p._search.includes(x))) return false;
    }
    return true;
  });
}

function renderNav() {
  const counts = {};
  DATA.products.forEach(p => counts[p.group] = (counts[p.group] || 0) + 1);
  const names = [...GROUPS.map(g => g[0]), "لوازم خرد و سایر"].filter(n => counts[n]);
  const nSale = DATA.products.filter(p => p._sale).length;
  $("#groups").innerHTML = (nSale ? [`<button data-g="__sale" class="salebtn ${VIEW.group === "__sale" ? "on" : ""}">🔥 فروش ویژه امروز <small>${fa(nSale)}</small></button>`] : [])
    .concat([`<button data-g="" class="${VIEW.group ? "" : "on"}">همه محصولات <small>${fa(DATA.products.length)}</small></button>`])
    .concat(names.map(n => `<button data-g="${esc(n)}" class="${VIEW.group === n ? "on" : ""}">${esc(n)} <small>${fa(counts[n])}</small></button>`)).join("");
  const inGroup = DATA.products.filter(p => !VIEW.group || p.group === VIEW.group || (VIEW.group === "__sale" && p._sale));
  const brands = [...new Set(inGroup.map(p => p.brand))];
  if (VIEW.brand && !brands.includes(VIEW.brand)) VIEW.brand = null;
  $("#brands").innerHTML = brands.length > 1 ? [`<button class="chip ${VIEW.brand ? "" : "on"}" data-b="">همه برندها</button>`]
    .concat(brands.map(b => `<button class="chip ${VIEW.brand === b ? "on" : ""}" data-b="${esc(b)}">${esc(b)}</button>`)).join("") : "";
}

function render() {
  renderNav();
  const list = filtered();
  $("#heading").textContent = VIEW.group === "__sale" ? "فروش ویژه امروز" : (VIEW.group || "همه محصولات");
  $("#count").textContent = `${fa(list.length)} کالا`;
  const nSale = DATA.products.filter(p => p._sale).length;
  const bar = nSale && VIEW.group !== "__sale" && !VIEW.q ? `<div class="salebar" id="salebar">🔥 فروش ویژه امروز: ${fa(nSale)} کالا <span>— دیدن همه ←</span></div>` : "";
  if (!list.length) { $("#grid").innerHTML = `<div class="empty">${VIEW.group === "__sale" ? "امروز هنوز فروش ویژه‌ای اعلام نشده است." : "کالایی با این مشخصات پیدا نشد."}</div>`; return; }
  $("#grid").innerHTML = (bar ? `<div style="grid-column:1/-1">${bar}</div>` : "") + list.map(p => {
    const [label, cls] = STATE[p._state];
    const mp = minPrice(p);
    const many = p.colors.filter(c => c.status === "ok").length > 1;
    const sc = p.colors.filter(c => c.sale).sort((a, b) => a.sale - b.sale)[0];
    const price = sc ? `<div class="price sale">${sc.list ? `<s>${money(sc.list)}</s>` : ""}<b>${money(sc.sale)}</b><small>${esc(DATA.unit)}</small></div>`
      : mp != null ? `<div class="price">${many ? "<small>از</small>" : ""}<b>${money(mp)}</b><small>${esc(DATA.unit)}</small></div>`
      : `<div class="price ${p._state === "out" ? "na" : "askp"}">${p._state === "out" ? "ناموجود" : "قیمت: استعلام بگیرید"}</div>`;
    const dots = p.colors.filter(c => c.name).map(c => `<span class="${c.status === "out" ? "x" : ""}">${esc(c.name)}</span>`).join("");
    return `<div class="card" data-id="${p.id}">
      <div class="pic">${p.image ? `<img loading="lazy" src="${imgUrl(p)}" alt="">` : placeholder(p)}<span class="badge ${cls}">${label}</span>${p._sale ? `<span class="badge b-sale">فروش ویژه</span>` : ""}</div>
      <div class="info"><div class="brand">${esc(p.brand)} · ${esc(p.category)}</div><div class="title">${esc(p.title)}</div>
      ${dots ? `<div class="dots">${dots}</div>` : ""}${price}</div></div>`;
  }).join("");
}

function openProduct(id) {
  const p = DATA.products.find(x => x.id === id);
  if (!p) return;
  const colors = p.colors.map(c => {
    const [label, cls] = STATE[c.status];
    const right = c.sale ? `<span class="p red">${c.list ? `<s>${money(c.list)}</s> ` : ""}${money(c.sale)} <small>${esc(DATA.unit)}</small></span>`
      : c.status === "ok" ? `<span class="p">${money(c.price)} <small>${esc(DATA.unit)}</small></span>` : `<span class="tag ${cls}">${label}</span>`;
    const tag = c.sale ? ` <span class="tag" style="background:var(--sale);color:#fff">فروش ویژه</span>` : c.status === "ok" ? ` <span class="tag b-ok">موجود</span>` : "";
    return `<div class="crow" data-ci="${p.colors.indexOf(c)}"><span>${esc(colorName(c))}${tag}</span>${right}</div>`;
  }).join("");
  const specs = p.specs.length ? `<div class="sec"><h3>مشخصات فنی</h3><table class="specs">${p.specs.map(s => `<tr><td>${esc(s[0])}</td><td>${esc(s[1])}</td></tr>`).join("")}</table></div>` : "";
  const feats = p.features.length ? `<div class="sec"><h3>ویژگی‌های کلیدی</h3><ul class="feat">${p.features.map(f => `<li>${esc(f)}</li>`).join("")}</ul></div>` : "";
  const desc = p.description ? `<div class="sec"><h3>معرفی محصول</h3><div class="desc">${esc(p.description)}</div></div>` : "";
  const none = !specs && !feats && !desc ? `<div class="sec"><h3>مشخصات</h3><div class="nodata">مشخصات کامل این کالا به‌زودی اضافه می‌شود. برای اطلاعات بیشتر با بهراد تجارت تماس بگیرید.</div></div>` : "";
  $("#sheet").innerHTML = `<button class="close" id="x">✕</button>
    <div class="left"><div class="big" id="big"></div><div class="pcap" id="pcap"></div>
      <div class="actions"><button class="btn-order" id="ord">ثبت درخواست سفارش</button><button class="btn-offer" id="off">پیشنهاد قیمت</button></div>
      <button class="primary ghost" id="mk"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg>ساخت کارت محصول</button></div>
    <div class="right"><h1>${esc(p.title)}</h1><div class="sub">${esc(p.brand)} · ${esc(p.category)} · قیمت روز ${fa(DATA.date || "")}</div>
      <div class="colors">${colors}</div>${feats}${specs}${desc}${none}</div>`;
  $("#modal").classList.add("open");
  $("#sheet").scrollTop = 0;
  $("#x").onclick = closeModal;
  const named = p.colors.some(c => c.name);
  const show = i => {
    SEL = i;
    const c = p.colors[i], ph = photoOf(p, c);
    $("#big").innerHTML = ph ? `<img src="${ph.url}" alt="">` : placeholder(p);
    $("#pcap").textContent = !ph || !named ? "" : ph.own ? `عکس رنگ ${colorName(c)}` : `عکس رنگ ${colorName(c)} موجود نیست؛ این تصویر رنگ دیگری از همین مدل است`;
    $("#pcap").className = "pcap" + (ph && named && !ph.own ? " warn" : "");
    document.querySelectorAll(".crow").forEach(r => r.classList.toggle("sel", +r.dataset.ci === i && named && p.colors.length > 1));
  };
  document.querySelectorAll(".crow").forEach(r => r.onclick = () => show(+r.dataset.ci));
  const first = p.colors.findIndex(c => c.image && (c.sale || c.status === "ok"));
  show(first >= 0 ? first : Math.max(0, p.colors.findIndex(c => c.image)));
  $("#mk").onclick = () => makeCard(p);
  $("#ord").onclick = () => openRequest(p, "order");
  $("#off").onclick = () => openRequest(p, "offer");
}
function closeModal() { $("#modal").classList.remove("open"); }

/* ---------------- product card (1080×1350 PNG) ---------------- */
const loadImg = src => new Promise(ok => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => ok(null); i.src = src; });
function rounded(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function fitText(ctx, text, max, size, weight) {
  let s = size;
  do { ctx.font = `${weight} ${s}px Vazirmatn`; s -= 2; } while (ctx.measureText(text).width > max && s > 20);
}
let CARD_NAME = "card.png";
async function makeCard(p) {
  await Promise.all([700, 800, 500].map(w => document.fonts.load(`${w} 40px Vazirmatn`, "آب")));
  const cv = $("#cv"), ctx = cv.getContext("2d"), W = 1080, H = 1350;
  ctx.direction = "rtl"; ctx.textAlign = "right"; ctx.textBaseline = "middle";
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, W, H);
  // header
  ctx.fillStyle = "#01254E"; ctx.fillRect(0, 0, W, 150);
  const logo = await loadImg("logo-white.png");
  if (logo) { const h = 104, w = logo.width * h / logo.height; ctx.drawImage(logo, W - 48 - w, 23, w, h); }
  ctx.fillStyle = "#fff"; ctx.textAlign = "left";
  ctx.font = "800 38px Vazirmatn"; ctx.fillText(fa(DATA.date || ""), 48, 62);
  ctx.font = "500 24px Vazirmatn"; ctx.globalAlpha = .8; ctx.fillText("قیمت روز همکاران", 48, 106); ctx.globalAlpha = 1;
  ctx.textAlign = "right";
  // picture
  const ph = photoOf(p, p.colors[SEL]);
  const pic = ph ? await loadImg(ph.url) : null;
  // layout from the bottom up: footer, price rows, title; the picture takes the rest
  const rows = p.colors.slice(0, 5);
  const rowH = rows.length > 3 ? 64 : 82, top = H - 140 - rows.length * rowH, titleY = top - 120;
  const box = {x: 110, y: 180, w: W - 220, h: titleY - 60 - 180};
  if (pic) {
    const s = Math.min(box.w / pic.width, box.h / pic.height);
    ctx.drawImage(pic, box.x + (box.w - pic.width * s) / 2, box.y + (box.h - pic.height * s) / 2, pic.width * s, pic.height * s);
  } else {
    ctx.fillStyle = "#E8EEF6"; rounded(ctx, box.x, box.y, box.w, box.h, 30); ctx.fill();
    ctx.fillStyle = "#01254E"; ctx.textAlign = "center"; ctx.font = "800 64px Vazirmatn"; ctx.fillText(p.brand, W / 2, box.y + box.h / 2 - 30);
    ctx.font = "500 40px Vazirmatn"; ctx.fillText(p.model, W / 2, box.y + box.h / 2 + 40); ctx.textAlign = "right";
  }
  // title
  ctx.fillStyle = "#01254E"; fitText(ctx, p.title, W - 120, 52, 800); ctx.fillText(p.title, W - 60, titleY);
  ctx.fillStyle = "#5B6B80"; ctx.font = "500 28px Vazirmatn"; ctx.fillText(`${p.brand} · ${p.category}`, W - 60, titleY + 55);
  ctx.fillStyle = "#F5B301"; ctx.fillRect(W - 160, titleY + 85, 100, 6);
  // colours and prices
  rows.forEach((c, i) => {
    const y = top + i * rowH;
    ctx.fillStyle = i % 2 ? "#fff" : "#F4F6FA"; rounded(ctx, 60, y, W - 120, rowH - 8, 16); ctx.fill();
    const mid = y + (rowH - 8) / 2;
    ctx.fillStyle = "#0F1B2D"; ctx.font = "700 32px Vazirmatn"; ctx.textAlign = "right"; ctx.fillText(colorName(c), W - 90, mid);
    ctx.textAlign = "left";
    if (c.status === "ok" || c.sale) {
      ctx.font = "500 22px Vazirmatn"; ctx.fillStyle = "#5B6B80"; ctx.fillText(DATA.unit, 90, mid + 4);
      const uw = ctx.measureText(DATA.unit).width;
      ctx.font = "800 42px Vazirmatn"; ctx.fillStyle = c.sale ? "#D32F2F" : "#01254E";
      const shown = money(c.sale || c.price); ctx.fillText(shown, 90 + uw + 14, mid);
      if (c.sale && c.list) {
        const x = 90 + uw + 14 + ctx.measureText(shown).width + 18;
        ctx.font = "500 26px Vazirmatn"; ctx.fillStyle = "#8A97A8"; const old = money(c.list); ctx.fillText(old, x, mid + 2);
        const ow = ctx.measureText(old).width; ctx.strokeStyle = "#8A97A8"; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(x - 2, mid + 2); ctx.lineTo(x + ow + 2, mid + 2); ctx.stroke();
      }
    } else {
      const [label] = STATE[c.status];
      ctx.font = "800 32px Vazirmatn"; ctx.fillStyle = c.status === "out" ? "#C62828" : "#946200"; ctx.fillText(label, 90, mid);
    }
  });
  // footer
  ctx.fillStyle = "#01254E"; ctx.fillRect(0, H - 110, W, 110);
  ctx.fillStyle = "#F5B301"; ctx.fillRect(0, H - 110, W, 6);
  ctx.fillStyle = "#fff"; ctx.textAlign = "center"; ctx.font = "800 32px Vazirmatn";
  ctx.fillText(DATA.contact || DATA.company || "بهراد تجارت", W / 2, H - 52);
  CARD_NAME = `${p.brand}-${p.model}`.replace(/[\\/:*?"<>|\s]+/g, "-") + ".png";
  $("#cardprev").classList.add("open");
}
async function saveCard() {
  const url = $("#cv").toDataURL("image/png");
  try {
    const r = window.pywebview ? await window.pywebview.api.save_png(url, CARD_NAME) : null;
    if (r) toast("کارت ذخیره شد: " + r);
    else if (!window.pywebview) { const a = document.createElement("a"); a.href = url; a.download = CARD_NAME; a.click(); }
  } catch (e) { toast("ذخیره نشد"); }
}
function toast(t, ms) { const el = $("#toast"); el.textContent = t; el.style.display = "block"; clearTimeout(el._t); el._t = setTimeout(() => el.style.display = "none", ms || 3500); }
const saleKeys = d => new Set(d.products.flatMap(p => p.colors.filter(c => c.sale).map(c => `${p.id}|${c.name}|${c.sale}`)));

/* ---------------- account, price offer and order request ---------------- */
let ACCOUNT = null;
const toEn = s => String(s || "").replace(/[۰-۹]/g, d => FA.indexOf(d)).replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d));
const digits = s => toEn(s).replace(/[^\d]/g, "");
async function api(path, body) {
  const r = await fetch(path, body ? {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)} : {});
  return r.json();
}
function dlg(html) {
  $("#dbox").innerHTML = `<button class="close" id="dx">✕</button>` + html;
  $("#dialog").classList.add("open");
  $("#dx").onclick = closeDlg;
  const first = $("#dbox input, #dbox select"); if (first) first.focus();
}
function closeDlg() { $("#dialog").classList.remove("open"); }
async function loadAccount() {
  try { ACCOUNT = (await api("/api/account")).account; } catch (e) { ACCOUNT = null; }
  $("#acctName").textContent = ACCOUNT ? (ACCOUNT.shop || ACCOUNT.name) : "ورود / ثبت‌نام";
}
function openAuth(mode, then) {
  const login = mode !== "signup";
  dlg(`<h2>${login ? "ورود به حساب" : "ساخت حساب همکار"}</h2>
    <div class="hint">${login ? "با شماره موبایل و رمزی که موقع ثبت‌نام گذاشتید وارد شوید." : "با ساخت حساب می‌توانید درخواست سفارش و پیشنهاد قیمت بفرستید؛ کارشناسان بهراد تجارت با شما تماس می‌گیرند."}</div>
    <div class="tabs"><button id="tLogin" class="${login ? "on" : ""}">ورود</button><button id="tSign" class="${login ? "" : "on"}">ثبت‌نام</button></div>
    ${login ? "" : `<label>نام و نام خانوادگی</label><input id="aName" autocomplete="name">
      <div class="row2"><div><label>نام فروشگاه</label><input id="aShop"></div><div><label>شهر</label><input id="aCity"></div></div>`}
    <label>شماره موبایل</label><input id="aMob" inputmode="numeric" placeholder="۰۹۱۲۱۲۳۴۵۶۷" dir="ltr" style="text-align:right">
    <label>رمز عبور${login ? "" : " (حداقل ۶ حرف)"}</label><input id="aPass" type="password">
    ${login ? "" : `<label>تکرار رمز عبور</label><input id="aPass2" type="password">`}
    <div class="err" id="aErr"></div>
    <button class="primary" id="aGo">${login ? "ورود" : "ساخت حساب"}</button>`);
  $("#tLogin").onclick = () => openAuth("login", then);
  $("#tSign").onclick = () => openAuth("signup", then);
  const go = async () => {
    const mobile = digits($("#aMob").value), password = $("#aPass").value, err = $("#aErr");
    if (!/^09\d{9}$/.test(mobile)) { err.textContent = "شماره موبایل را درست وارد کنید (۱۱ رقم، با ۰۹ شروع شود)."; return; }
    let body = {mobile, password};
    if (!login) {
      body = {...body, name: $("#aName").value.trim(), shop: $("#aShop").value.trim(), city: $("#aCity").value.trim()};
      if (!body.name || !body.shop || !body.city) { err.textContent = "نام، نام فروشگاه و شهر را بنویسید."; return; }
      if (password.length < 6) { err.textContent = "رمز باید حداقل ۶ حرف باشد."; return; }
      if (password !== $("#aPass2").value) { err.textContent = "تکرار رمز با خود رمز یکی نیست."; return; }
    }
    $("#aGo").disabled = true;
    const r = await api(login ? "/api/login" : "/api/signup", body);
    $("#aGo").disabled = false;
    if (!r.ok) { err.textContent = r.error || "انجام نشد."; return; }
    await loadAccount();
    closeDlg();
    toast(login ? "خوش آمدید" : "حساب شما ساخته شد");
    if (then) then();
  };
  $("#aGo").onclick = go;
  $("#dbox").onkeydown = e => { if (e.key === "Enter" && e.target.tagName === "INPUT") go(); };
}
function openRequest(p, type) {
  if (!ACCOUNT) { openAuth("login", () => openRequest(p, type)); return; }
  const offer = type === "offer";
  const colors = p.colors.length ? p.colors : [{name: "", status: "ask"}];
  const pick = colors.find(c => c.sale || c.status === "ok") || colors[0];
  const priceOf = c => c.sale || (c.status === "ok" ? c.price : null);
  dlg(`<h2>${offer ? "پیشنهاد قیمت" : "ثبت درخواست سفارش"}</h2>
    <div class="hint">${offer ? "قیمت پیشنهادی خود را بنویسید؛ کارشناسان ما بررسی می‌کنند و با شما تماس می‌گیرند." : "درخواست شما برای کارشناسان فرستاده می‌شود و برای نهایی کردن سفارش با شما تماس می‌گیرند."}</div>
    <div class="prod"><img id="rImg" alt="" style="display:none"><b>${esc(p.title)}</b></div>
    <div class="row2">
      <div><label>رنگ</label><select id="rColor">${colors.map((c, i) => `<option value="${i}" ${c === pick ? "selected" : ""}>${esc(colorName(c))}${c.status === "out" && !c.sale ? " (ناموجود)" : ""}</option>`).join("")}</select></div>
      <div><label>تعداد</label><input id="rQty" inputmode="numeric" value="۱"></div>
    </div>
    <div class="hint" id="rList" style="margin:8px 0 0"></div>
    ${offer ? `<label>قیمت پیشنهادی شما برای هر عدد (${esc(DATA.unit)})</label><input id="rPrice" inputmode="numeric" placeholder="مثلاً ۲۷۰٬۰۰۰٬۰۰۰">` : ""}
    <label>توضیحات (اختیاری)</label><textarea id="rNote" placeholder="${offer ? "مثلاً: برای خرید ۱۰ عدد، تسویه نقدی" : "مثلاً: زمان تحویل، نحوه تسویه، ارسال به شهرستان"}"></textarea>
    <div class="err" id="rErr"></div>
    <button class="primary" id="rGo">${offer ? "ارسال پیشنهاد در واتساپ" : "ارسال سفارش در واتساپ"}</button>`);
  const showList = () => {
    const c = colors[$("#rColor").value], v = priceOf(c), ph = photoOf(p, c);
    if (ph) { $("#rImg").src = ph.url; $("#rImg").style.display = ""; }
    $("#rList").textContent = v ? `قیمت ${c.sale ? "فروش ویژه" : "لیست"} امروز: ${money(v)} ${DATA.unit}` : (c.status === "out" ? "این رنگ امروز ناموجود است؛ درخواست شما ثبت و پیگیری می‌شود." : "قیمت این کالا استعلامی است.");
  };
  $("#rColor").onchange = showList; showList();
  $("#rGo").onclick = async () => {
    const c = colors[$("#rColor").value], qty = parseInt(digits($("#rQty").value) || "0", 10), err = $("#rErr");
    if (!qty || qty < 1) { err.textContent = "تعداد را بنویسید."; return; }
    let offered = null;
    if (offer) {
      offered = parseInt(digits($("#rPrice").value) || "0", 10);
      if (!offered) { err.textContent = "قیمت پیشنهادی را بنویسید."; return; }
    }
    $("#rGo").disabled = true;
    const r = await api("/api/request", {type, product_id: p.id, brand: p.brand, model: p.model, title: p.title, color: c.name || "",
      qty, offered, list_price: priceOf(c), sale: !!c.sale, note: $("#rNote").value.trim(), date: DATA.date || ""});
    $("#rGo").disabled = false;
    if (!r.ok) { err.textContent = r.error || "ثبت نشد."; return; }
    closeDlg();
    toast(r.status === "sent" ? "واتساپ باز شد؛ پیام را «ارسال» کنید" : "ثبت شد؛ با وصل شدن اینترنت خودکار ارسال می‌شود");
  };
}
async function openMine() {
  const r = await api("/api/requests");
  const label = {order: "درخواست سفارش", offer: "پیشنهاد قیمت"};
  const rows = (r.requests || []).map(x => `<div class="req"><span class="st ${x.status}">${x.status === "sent" ? "واتساپ" : "ارسال نشد"}</span>
    <b>${label[x.type] || ""}</b> · ${esc(x.title)}${x.color ? " · " + esc(x.color) : ""}<br>
    <small>تعداد ${fa(x.qty)}${x.offered ? ` · پیشنهاد ${money(x.offered)} ${esc(DATA.unit)}` : ""} · ${fa(x.when || "")}</small>
    ${x.note ? `<br><small>${esc(x.note)}</small>` : ""}</div>`).join("");
  dlg(`<h2>درخواست‌های من</h2><div class="hint">درخواست‌هایی که از این دستگاه فرستاده‌اید. نتیجه را کارشناسان تلفنی به شما اطلاع می‌دهند.</div>
    ${rows || `<div class="nodata">هنوز درخواستی نفرستاده‌اید.</div>`}`);
}
function toggleMenu() {
  if (!ACCOUNT) { openAuth("login"); return; }
  const m = $("#menu");
  if (m.classList.contains("open")) { m.classList.remove("open"); return; }
  m.innerHTML = `<div class="who"><b>${esc(ACCOUNT.name)}</b><br><small>${esc(ACCOUNT.shop)} · ${esc(ACCOUNT.city)}<br>${fa(ACCOUNT.mobile)}</small></div>
    <button id="mMine">درخواست‌های من</button><button id="mOut">خروج از حساب</button>`;
  m.classList.add("open");
  $("#mMine").onclick = () => { m.classList.remove("open"); openMine(); };
  $("#mOut").onclick = async () => { m.classList.remove("open"); await api("/api/logout", {}); await loadAccount(); toast("از حساب خارج شدید"); };
}
$("#acct").onclick = e => { e.stopPropagation(); toggleMenu(); };
document.addEventListener("click", e => { if (!e.target.closest("#menu")) $("#menu").classList.remove("open"); });
$("#dialog").addEventListener("click", e => { if (e.target.id === "dialog") closeDlg(); });

/* ---------------- data ---------------- */
function prepare(d) {
  d.products.forEach(p => {
    p.group = groupOf(p);
    p._state = stateOf(p);
    p._sale = p.colors.some(c => c.sale);
    p._search = norm([p.title, p.brand, p.model, p.category, p.group, ...p.colors.map(c => c.name)].join(" "));
  });
  const order = {ok: 0, ask: 1, out: 2};
  d.products.sort((a, b) => (b._sale - a._sale) || (order[a._state] - order[b._state]));
  return d;
}
function showMeta() {
  $("#day").textContent = DATA.date ? fa(DATA.date) : "—";
  if (DATA.company) $("#company").textContent = DATA.company;
  const u = (META.fetched || DATA.updated || "").slice(11, 16);
  $("#upd").textContent = u ? `به‌روز: ساعت ${fa(u)}` : "";
  const st = $("#stale");
  if (META.today && DATA.jdate && META.today !== DATA.jdate) {
    st.textContent = `توجه: قیمت‌ها مربوط به ${fa(DATA.date)} است؛ برای قیمت امروز به اینترنت وصل شوید و دکمه به‌روزرسانی را بزنید.`;
    st.style.display = "block";
  } else st.style.display = "none";
}
async function load(force) {
  const btn = $("#refresh"); if (force) btn.classList.add("spin");
  try {
    const r = await (await fetch(force ? "/api/refresh" : "/api/catalog", {method: force ? "POST" : "GET"})).json();
    META = r.meta || {};
    if (r.catalog && (!DATA || r.catalog.updated !== DATA.updated)) {
      const keep = DATA ? $("#modal").classList.contains("open") : false;
      const before = DATA ? saleKeys(DATA) : null;
      DATA = prepare(r.catalog); showMeta(); if (!keep) render();
      const fresh = before ? [...saleKeys(DATA)].filter(k => !before.has(k)) : [];
      if (fresh.length) {  // a new «فروش ویژه» post in the channel reaches an open window within a minute or two
        const n = new Set(fresh.map(k => k.split("|")[0])).size;
        toast(`🔥 فروش ویژه تازه: ${fa(n)} کالا — برای دیدن، «فروش ویژه امروز» را بزنید`, 9000);
      } else if (force) toast("قیمت‌ها به‌روز شد");
    } else if (force) toast(META.error ? "اینترنت در دسترس نیست؛ آخرین قیمت‌های ذخیره‌شده نمایش داده می‌شود" : "قیمت‌ها به‌روز است");
    if (!r.catalog) $("#grid").innerHTML = `<div class="empty">برای بار اول باید به اینترنت وصل باشید تا کاتالوگ دریافت شود.</div>`;
    showMeta();
  } finally { btn.classList.remove("spin"); }
}

$("#q").addEventListener("input", e => { VIEW.q = e.target.value; render(); });
$("#instock").addEventListener("change", e => { VIEW.instock = e.target.checked; render(); });
$("#groups").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; VIEW.group = b.dataset.g || null; VIEW.brand = null; render(); });
$("#brands").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; VIEW.brand = b.dataset.b || null; render(); });
$("#grid").addEventListener("click", e => {
  if (e.target.closest("#salebar")) { VIEW.group = "__sale"; VIEW.brand = null; render(); window.scrollTo(0, 0); return; }
  const c = e.target.closest(".card"); if (c) openProduct(c.dataset.id);
});
$("#modal").addEventListener("click", e => { if (e.target.id === "modal") closeModal(); });
$("#refresh").onclick = () => load(true);
$("#saveCard").onclick = saveCard;
$("#closeCard").onclick = () => $("#cardprev").classList.remove("open");
document.addEventListener("keydown", e => { if (e.key === "Escape") { if ($("#dialog").classList.contains("open")) return closeDlg(); $("#cardprev").classList.remove("open"); closeModal(); } });
load(false);
loadAccount();
setInterval(() => load(false), 30 * 1000);  // only asks the program on this PC; the program checks the internet each minute
</script>
</body>
</html>
